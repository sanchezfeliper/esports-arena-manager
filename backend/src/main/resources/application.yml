server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: esports-arena-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/eam;MODE=MySQL;AUTO_SERVER=TRUE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  admin:
    email: ${ADMIN_EMAIL:admin@arena.local}
    password: ${ADMIN_PASSWORD}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
