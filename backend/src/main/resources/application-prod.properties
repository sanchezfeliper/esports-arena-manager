# 1 Solo se usa con SPRING_PROFILES_ACTIVE=prod
# 2 Sin valor de reserva: si falta, no arranca
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
# 3 Pocas conexiones: el pooler tiene un límite
spring.datasource.hikari.maximum-pool-size=5
# 4 Sin los valores de tu computador
app.cors.origenes=${CORS_ORIGENES}
app.jwt.secreto=${JWT_SECRETO}